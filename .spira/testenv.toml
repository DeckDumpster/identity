# Declares the identity repo's suites to testenv. Shell; needs curl and python3 (fixture server).
image = "docker.io/library/buildpack-deps:bookworm"
workdir = "/work"
timeout = 300
# ci_entry is the command a queue.local round runs on a round VM (read by the
# harness's gate::own::ci_entry): the whole of CI, every tier of `default` in order.
ci_entry = "bash ci.sh"
default = ["test-deploy", "test-infra", "test-check", "test-breakglass", "test-backup"]

[tier.test-deploy]
argv = ["bash", "test-deploy.sh"]
timeout = 120

[tier.test-infra]
argv = ["bash", "test-infra.sh"]
timeout = 240

[tier.test-check]
argv = ["bash", "test-check.sh"]
timeout = 120

[tier.test-breakglass]
argv = ["bash", "test-breakglass.sh"]
timeout = 120

[tier.test-backup]
argv = ["bash", "test-backup.sh"]
timeout = 120
